# fly.toml — MCP Server for x402 Base Analytics
# Deploy: flyctl launch --copy-config --name x402-mcp

app = "x402-mcp"
# primary_region = "sin"  # Singapore (closest to Indonesia) — let Fly auto-select

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  MCP_PORT = "4022"
  FACILITATOR_URL = "https://api.cdp.coinbase.com/platform/v2/x402"

# PAY_TO_ADDRESS set via: flyctl secrets set PAY_TO_ADDRESS=0x...

[http_service]
  internal_port = 4022
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
